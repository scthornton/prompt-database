[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-database"
version = "0.1.0"
description = "Curated prompt injection attack database for defensive AI security research"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Scott Thornton", email = "scthornton@gmail.com" },
]
keywords = [
    "ai-security",
    "prompt-injection",
    "red-teaming",
    "llm-security",
    "defensive-security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
test = [
    "httpx>=0.27",
    "openai>=1.0",
    "anthropic>=0.30",
]

[project.scripts]
prompt-db = "prompt_database.cli:main"

[project.urls]
Homepage = "https://github.com/scthornton/prompt-database"
Repository = "https://github.com/scthornton/prompt-database"
Issues = "https://github.com/scthornton/prompt-database/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
